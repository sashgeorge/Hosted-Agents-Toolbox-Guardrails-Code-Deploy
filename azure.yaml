# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# One `azd up` builds the whole sample, in this order:
#
#   provision       Foundry account, project, model deployments   (this file)
#   postprovision   guardrail -> skills + toolbox -> MCP server
#                   -> memory store -> prompt agent               (hook below)
#   deploy          hosted agent, using the same toolbox,
#                   guardrail, and memory store                   (this file)
#
# Guardrails, skills, toolboxes, MCP servers, memory stores, and prompt agents
# have no declarative service type in azure.yaml, so the hook creates them by
# running the numbered scripts. The hook also writes the guardrail's ARM id back
# with `azd env set`, which is how ${AZURE_RAI_POLICY_ID} below is populated.
#
# Prerequisites:
#   azd 1.34 or later, then:
#     azd extension upgrade --all
#   Earlier azd builds report azure.ai.agents as Incompatible and `azd up` fails.
#
# Setup:
#   azd auth login
#   azd env new dev
#   azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME gpt-5.5-1
#   azd env set TOOLBOX_NAME telco-toolbox
#   azd env set MEMORY_STORE_NAME telco-memory
#   azd env set MEMORY_CHAT_MODEL gpt-5.5-1
#   azd env set MEMORY_EMBEDDING_MODEL text-embedding-3-large
#   # Optional, to include the remote MCP server in the toolbox:
#   azd env set DYNAMIC_WF_MCP_URL https://<host>/mcp
#   azd env set DYNAMIC_WF_MCP_KEY <secret>
#
# Deploy:
#   azd up        provision + postprovision + deploy
#   azd deploy    hosted agent code changes only
#   azd down      tear the environment down

requiredVersions:
  azd: '>=1.34.0'

extensions:
  azure.ai.agents: '>=1.0.0-beta.9'
  azure.ai.toolboxes: '>=1.0.0-beta.6'
  azure.ai.skills: '>=1.0.0-beta.5'

name: telco-support-agent

hooks:
  postprovision:
    windows:
      shell: pwsh
      continueOnError: false
      interactive: true
      run: python scripts/azd_postprovision.py
    posix:
      shell: sh
      continueOnError: false
      interactive: true
      run: python scripts/azd_postprovision.py

services:
  ai-project:
    host: azure.ai.project
    deployments:
      # Chat model for the agents and for memory extraction.
      - name: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        model:
          format: OpenAI
          name: gpt-5.5-1
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
      # The memory store requires an embedding deployment of its own.
      - name: ${MEMORY_EMBEDDING_MODEL}
        model:
          format: OpenAI
          name: text-embedding-3-large
          version: '1'
        sku:
          name: Standard
          capacity: 10

  telco-support-agent:
    host: azure.ai.agent
    kind: hosted
    name: telco-support-agent
    displayName: Contoso Telco support agent
    description: >-
      Telco customer-support agent on the Responses protocol. Answers plan,
      billing, usage, outage, and troubleshooting questions using local functions
      plus the tools and skills published to the Foundry toolbox, with long-term
      memory scoped per subscriber.
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Toolbox
        - Guardrails
        - Memory
    project: src/telco_support_agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: ${TOOLBOX_NAME}
      # Blank disables recall without any code change.
      MEMORY_STORE_NAME: ${MEMORY_STORE_NAME}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
    # Equivalent of rai_config in 03_deploy_hosted_agent.py. Populated by the
    # postprovision hook, which creates the guardrail and exports its ARM id.
    policies:
      - type: rai_policy
        raiPolicyName: ${AZURE_RAI_POLICY_ID}

infra:
  provider: microsoft.foundry
