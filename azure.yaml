# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# One `azd up` builds the whole sample, in this order:
#
#   provision       account, project, deployments, guardrail, connections,
#                   RBAC                                          (infra/*.bicep)
#   postprovision   skills -> toolbox -> memory store
#                   -> prompt agent                   (scripts/postprovision.ps1)
#   deploy          hosted agent, using the same toolbox,
#                   guardrail, and memory store                    (this file)
#
# Everything with an ARM type is declared in Bicep. Skills, toolboxes, memory
# stores, and prompt agents have no ARM type, so the hook creates them with
# `azd ai skill`, `azd ai toolbox`, and two `az rest` calls. No Python runs.
#
# ${AZURE_RAI_POLICY_ID} below is a Bicep output, surfaced automatically as an
# azd environment variable.
#
# Prerequisites:
#   azd 1.34 or later, then:
#     azd extension upgrade --all
#   Earlier azd builds report azure.ai.agents as Incompatible and `azd up` fails.
#
# Setup:
#   azd auth login
#   azd env new dev
#   # Optional, to include the remote MCP server in the toolbox:
#   azd env set DYNAMIC_WF_MCP_URL https://<host>/mcp
#   azd env set DYNAMIC_WF_MCP_KEY <secret>
#
# Deploy:
#   azd up        provision + postprovision + deploy
#   azd deploy    hosted agent code changes only
#   azd down      tear the environment down
#
# The numbered Python scripts remain as an annotated reference for the same
# operations; they are not used by this path.

requiredVersions:
  azd: '>=1.34.0'

extensions:
  azure.ai.agents: '>=1.0.0-beta.9'
  azure.ai.toolboxes: '>=1.0.0-beta.6'
  azure.ai.skills: '>=1.0.0-beta.5'

name: telco-support-agent

hooks:
  postprovision:
    windows:
      shell: pwsh
      continueOnError: false
      interactive: true
      run: ./scripts/postprovision.ps1
    posix:
      shell: sh
      continueOnError: false
      interactive: true
      run: pwsh ./scripts/postprovision.ps1

services:
  telco-support-agent:
    host: azure.ai.agent
    kind: hosted
    name: telco-support-agent
    displayName: Contoso Telco support agent
    description: >-
      Telco customer-support agent on the Responses protocol. Answers plan,
      billing, usage, outage, and troubleshooting questions using local functions
      plus the tools and skills published to the Foundry toolbox, with long-term
      memory scoped per subscriber.
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Toolbox
        - Guardrails
        - Memory
    project: src/telco_support_agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_NAME: ${TOOLBOX_NAME}
      # Blank disables recall without any code change.
      MEMORY_STORE_NAME: ${MEMORY_STORE_NAME}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
    # Equivalent of rai_config in 03_deploy_hosted_agent.py. The ARM id comes
    # from the Bicep output of the same name.
    policies:
      - type: rai_policy
        raiPolicyName: ${AZURE_RAI_POLICY_ID}

infra:
  provider: bicep
  path: infra
  module: main
