# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# `azd up` provisions the platform and every data-plane artifact:
#
#   provision       account, project, deployments, guardrail, connections,
#                   RBAC                                          (infra/*.bicep)
#   postprovision   skills -> toolbox -> memory store
#                   -> prompt agent                   (scripts/postprovision.ps1)
#
# Everything with an ARM type is declared in Bicep. Skills, toolboxes, memory
# stores, and prompt agents have no ARM type, so the hook creates them with
# `azd ai skill`, `azd ai toolbox`, and two `az rest` calls. No Python runs.
#
# The hosted agent is deliberately NOT deployed here. It is a container build
# with its own release cadence, so deploy it separately once the platform is up:
#
#   python 03_deploy_hosted_agent.py
#
# It consumes the same toolbox, guardrail, and memory store this file creates.
#
# Prerequisites:
#   azd 1.34 or later, then:
#     azd extension upgrade --all
#
# Setup:
#   azd auth login --tenant-id <tenant of your subscription>
#   azd env new telco-dev
#   azd env set AZURE_SUBSCRIPTION_ID <subscription id>
#   azd env set AZURE_LOCATION westus3
#   # Optional, to include the remote MCP server in the toolbox:
#   azd env set DYNAMIC_WF_MCP_URL https://<host>/mcp
#   azd env set DYNAMIC_WF_MCP_KEY <secret>
#
# Deploy:
#   azd provision --preview   check first
#   azd up                    provision + postprovision
#   azd down                  tear the environment down
#
# The numbered Python scripts remain as an annotated reference for the same
# operations; only 03 is required by this path.

requiredVersions:
  azd: '>=1.34.0'

extensions:
  azure.ai.toolboxes: '>=1.0.0-beta.6'
  azure.ai.skills: '>=1.0.0-beta.5'

name: telco-support-agent

hooks:
  postprovision:
    windows:
      shell: pwsh
      continueOnError: false
      interactive: true
      run: ./scripts/postprovision.ps1
    posix:
      shell: sh
      continueOnError: false
      interactive: true
      run: pwsh ./scripts/postprovision.ps1

infra:
  provider: bicep
  path: infra
  module: main
